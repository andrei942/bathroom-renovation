<!DOCTYPE html>
<html>
<head>
  <title>Bathroom Renovation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<h1>Bathroom Renovation</h1>

<label>Upload your room photo:</label>
<input type="file" id="roomUpload" accept="image/*">
<img id="roomImage" src="" alt="Your Room" style="max-width:400px; display:block; margin-top:10px; border:1px solid #ccc;">

<h2>Select items to renovate:</h2>
<label><input type="checkbox" id="toiletSelect"> Replace Toilet</label><br>
<label><input type="checkbox" id="sinkSelect"> Replace Sink</label><br>
<label><input type="checkbox" id="bathtubSelect"> Replace Bathtub</label><br>
<label><input type="checkbox" id="tilesSelect"> Replace Floor Tiles</label><br>
<label><input type="checkbox" id="wallSelect"> Repaint Walls</label><br>

<h2>Total Estimate: £<span id="price">0</span></h2>

<button id="downloadPDF">Download Estimate PDF</button>

<script src="js/script.js"></script>
</body>
</html>
